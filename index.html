<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roomy</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#000000">
    <style>
        :root { --bg: #000000; --card: #1c1c1e; --text: #f5f5f7; --accent: #0a84ff; --border: #3a3a3c; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; -webkit-tap-highlight-color: transparent; transition: all 0.3s ease; }
        .pantalla-centrada { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; }
        .hidden { display: none !important; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid var(--border); box-sizing: border-box; }
        input, select, button { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: #2c2c2e; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        button { background: var(--accent); color: white; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
        button:active { filter: brightness(0.8); transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secundario { background: #3a3a3c; color: white; }
        .btn-piso { background: #2c2c2e; border: 1px solid var(--border); text-align: left; padding: 16px; margin-bottom: 10px; border-radius: 14px; font-weight: 600; font-size: 1.1em; }
        .nav-inferior { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(28,28,30,0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { color: #86868b; text-align: center; font-size: 0.8em; flex: 1; cursor: pointer; }
        .nav-item.activo { color: var(--accent); }
        .nav-icon { font-size: 1.5em; display: block; margin-bottom: 4px; }
        .contenido-tab { padding-bottom: 90px; }
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #2c2c2e; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .badge { background: var(--accent); color: white; padding: 4px 8px; border-radius: 8px; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body class="pantalla-centrada">

    <!-- PANTALLA TUS PISOS -->
    <div id="pantallaMisPisos" class="card">
        <h2 style="text-align: center;">🏠 Roomy</h2>
        <div id="listaMisPisos" style="margin-top: 25px;"></div>
        <button id="btnIrCrearPiso" class="btn-outline" style="margin-top: 15px; background: #1c1c1e;">+ Crear un piso nuevo</button>
        <button id="btnIrUnirsePiso" class="btn-outline" style="margin-top: 10px; background: #1c1c1e;">🔗 Tengo un enlace de invitación</button>
    </div>

    <!-- PANTALLA CREAR PISO -->
    <div id="pantallaCrear" class="card hidden">
        <h2 style="text-align: center;">✨ Nuevo Piso</h2>
        <input type="text" id="nombrePiso" placeholder="Nombre del piso (Ej: Piso Estudiantes)">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="inputNuevoNombre" placeholder="Añadir inquilino" style="margin-bottom: 0;">
            <button id="btnAñadirNombre" type="button" style="width: 60px; margin-bottom: 0; font-size: 1.4em; background: #2c2c2e; color: #0a84ff; border: 1px solid #3a3a3c;">+</button>
        </div>
        <div id="contenedorNuevosNombres" style="margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
        <button id="btnCrear">Crear Piso</button>
        <button id="btnIrUnirsePiso2" class="btn-outline" style="margin-top: 10px; background: #1c1c1e; color: #f5f5f7; border-color: #3a3a3c;">🔗 Tengo un enlace de invitación</button>
        <button id="btnCancelarCrear" class="btn-secundario hidden" style="margin-top: 10px;">Volver</button>
    </div>

    <!-- PANTALLA UNIRSE / SELECCIONAR USUARIO -->
    <div id="pantallaUnirse" class="card hidden">
        <h2 style="text-align: center;">👋 ¿Quién eres?</h2>
        <p style="text-align: center; color: #86868b; font-size: 0.9em;">Selecciona tu nombre para entrar al piso</p>
        <div id="listaInquilinos" style="margin-top: 20px;"></div>
        <button id="btnVolverInicio" class="btn-secundario" style="margin-top: 15px;">Volver</button>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="pantallaDashboard" class="hidden" style="width: 100%; max-width: 600px; margin: 0 auto;">
        <div class="header-app">
            <div>
                <h2 id="tituloDashboard" style="margin: 0;">Roomy</h2>
                <small id="subtituloDashboard" style="color: #86868b;"></small>
            </div>
            <div>
                <button id="btnCambiarUsuario" style="background: transparent; border: none; font-size: 1.5em; width: auto; padding: 5px;">🔄</button>
                <button id="btnVolverMenu" style="background: transparent; border: none; font-size: 1.5em; width: auto; padding: 5px;">🏠</button>
            </div>
        </div>

        <!-- CONTENEDORES DE PESTAÑAS -->
        <div id="tabGastos" class="contenido-tab">
            <h3>💸 Gastos y Cuentas</h3>
            <button id="btnNuevoGasto">+ Añadir Gasto</button>
            <div id="listaDeudas" style="margin-bottom: 20px;"></div>
            <div id="historialGastos"></div>
        </div>

        <div id="tabCompra" class="contenido-tab hidden">
            <h3>🛒 Lista de la Compra</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="inputNuevoProducto" placeholder="¿Qué hace falta?">
                <button id="btnAñadirProducto" style="width: 80px;">Añadir</button>
            </div>
            <div id="listaProductos"></div>
            <button id="btnComprarMarcados" class="hidden" style="margin-top: 15px;">Transformar marcados en Gasto</button>
        </div>

        <div id="tabLimpieza" class="contenido-tab hidden">
            <h3>🧹 Tareas y Limpieza</h3>
            <button id="btnNuevaZona" class="btn-secundario">+ Configurar nueva zona</button>
            <div id="listaLimpieza" style="margin-top: 15px;"></div>
        </div>

        <div id="tabTablon" class="contenido-tab hidden">
            <h3>📌 Tablón y Ranking</h3>
            <div id="tarjetaWiFi" class="card" style="margin-bottom: 15px; text-align: center;">
                <h4>📶 Wi-Fi del Piso</h4>
                <div id="qrWiFi" style="background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 10px 0;"></div>
                <button id="btnConfigurarWiFi" class="btn-secundario btn-outline" style="padding: 8px;">Configurar Wi-Fi</button>
            </div>
            <div class="card">
                <h4 style="margin-top:0;">🏆 Ranking del Piso</h4>
                <div id="rankingUsuarios"></div>
            </div>
        </div>

        <!-- NAVEGACIÓN INFERIOR -->
        <nav class="nav-inferior">
            <div class="nav-item activo" onclick="cambiarTab('Gastos')"><span class="nav-icon">💸</span>Gastos</div>
            <div class="nav-item" onclick="cambiarTab('Compra')"><span class="nav-icon">🛒</span>Compra</div>
            <div class="nav-item" onclick="cambiarTab('Limpieza')"><span class="nav-icon">🧹</span>Limpieza</div>
            <div class="nav-item" onclick="cambiarTab('Tablon')"><span class="nav-icon">📌</span>Tablón</div>
        </nav>
    </div>

    <!-- Script de códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
